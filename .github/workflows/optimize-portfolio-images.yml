name: Optimize portfolio images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.jpg'
      - '*.jpeg'
      - '.github/workflows/optimize-portfolio-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Resize and compress oversized JPEGs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, UnidentifiedImageError

          MAX_DIM = 1600
          TARGET_BYTES = 950_000
          SIZE_TRIGGER = 700_000
          qualities = (86, 82, 78, 74, 70)

          paths = sorted(set(Path('.').glob('*.jpg')) | set(Path('.').glob('*.jpeg')))
          changed = []

          for path in paths:
              original_size = path.stat().st_size
              try:
                  with Image.open(path) as source:
                      image = ImageOps.exif_transpose(source).convert('RGB')
              except (UnidentifiedImageError, OSError) as exc:
                  print(f'Skipping unreadable image {path}: {exc}')
                  continue

              original_dimensions = image.size
              needs_resize = max(image.size) > MAX_DIM
              needs_compress = original_size > SIZE_TRIGGER

              if not needs_resize and not needs_compress:
                  continue

              if needs_resize:
                  image.thumbnail((MAX_DIM, MAX_DIM), Image.Resampling.LANCZOS)

              temp = path.with_suffix(path.suffix + '.tmp')
              best_size = None
              for quality in qualities:
                  image.save(temp, format='JPEG', quality=quality, optimize=True, progressive=True)
                  best_size = temp.stat().st_size
                  if best_size <= TARGET_BYTES:
                      break

              if best_size is not None and best_size < original_size:
                  temp.replace(path)
                  changed.append((str(path), original_dimensions, image.size, original_size, best_size))
              else:
                  temp.unlink(missing_ok=True)

          for path, old_dim, new_dim, old_size, new_size in changed:
              print(f'{path}: {old_dim} -> {new_dim}; {old_size/1024:.0f} KB -> {new_size/1024:.0f} KB')
          PY

      - name: Commit optimized images
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No image changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.jpg' '*.jpeg'
          git commit -m 'Optimize portfolio images'
          git pull --rebase origin main
          git push origin main
